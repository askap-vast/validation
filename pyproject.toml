[tool.poetry]
name = "vast-validation"
version = "0.3.0"
description = ""
authors = ["Andrew O'Brien <obrienan@uwm.edu>"]
license = "MIT"
packages = [
    { include = "validation" },
]

[tool.poetry.dependencies]
python = "^3.9"
Django = "^3.2.5"
pandas = "^1.3.1"
astropy = "^4.3.post1"
bokeh = "^2.3.3"
social-auth-app-django = "^5.0.0"
django-environ = "^0.4.5"
whitenoise = "^5.3.0"
django-debug-toolbar = "^3.2.1"
django-filter = "^21.1"
djangorestframework = "^3.13.1"

[tool.poetry.dev-dependencies]
mypy = "^0.910"
black = "^21.7b0"
flake8 = "^3.9.2"
rope = "^0.19.0"
ipython = "^7.26.0"
django-stubs = "^1.8.0"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "vast_validation_site.settings"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
